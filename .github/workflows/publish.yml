name: Publish

on:
  push:
    tags:
      - 'v*'
      - 'sdk-v*'
      - 'sdk-py-v*'
      - 'create-arc-app-v*'

jobs:
  publish-npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/sdk-v') || startsWith(github.ref, 'refs/tags/create-arc-app-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          npm whoami

      - name: Publish arckit-sdk
        if: startsWith(github.ref, 'refs/tags/sdk-v') || startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/sdk
        run: pnpm publish --access public --no-git-checks

      - name: Publish create-arc-app
        if: startsWith(github.ref, 'refs/tags/create-arc-app-v') || startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/create-arc-app
        run: pnpm publish --access public --no-git-checks

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/sdk-py-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        working-directory: packages/sdk-py
        run: python -m build

      - name: Publish to PyPI
        working-directory: packages/sdk-py
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
