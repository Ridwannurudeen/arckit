name: Publish

on:
  push:
    tags:
      - 'v*'
      - 'sdk-v*'
      - 'sdk-py-v*'
      - 'create-arc-app-v*'

jobs:
  publish-npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/sdk-v') || startsWith(github.ref, 'refs/tags/create-arc-app-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Use npm config set rather than writing .npmrc directly — npm handles
          # the format and avoids any quoting/encoding pitfalls.
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm config set registry "https://registry.npmjs.org/"

          # Verify token length is what we expect (real tokens are ~40+ chars).
          # Print only the length, never the token itself.
          echo "Token length: ${#NPM_TOKEN}"

          # Confirm npm sees the auth.
          echo "--- npm config list ---"
          npm config list | grep -v "_authToken"

          echo "--- npm whoami ---"
          npm whoami

      - name: Publish arckit-sdk
        if: startsWith(github.ref, 'refs/tags/sdk-v') || startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/sdk
        run: pnpm publish --access public --no-git-checks

      - name: Publish create-arc-app
        if: startsWith(github.ref, 'refs/tags/create-arc-app-v') || startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/create-arc-app
        run: pnpm publish --access public --no-git-checks

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/sdk-py-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        working-directory: packages/sdk-py
        run: python -m build

      - name: Publish to PyPI
        working-directory: packages/sdk-py
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
